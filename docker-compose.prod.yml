# Production overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Internal services are not published to the host. Set ENVIRONMENT=production in .env.

services:
  postgres:
    ports:  []

  redis:
    ports:  []

  backend:
    environment:
      REDIS_ENABLED: "true"
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: strict
      TELITE_USE_ALEMBIC: "true"
      LOG_FORMAT: json
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; port=os.getenv('BACKEND_INTERNAL_PORT','8001'); urllib.request.urlopen(f'http://127.0.0.1:{port}/health/readiness', timeout=5)",
        ]

  seed_permissions:
    environment:
      ENVIRONMENT: production
      TELITE_USE_ALEMBIC: "true"

  celery_worker:
    environment:
      ENVIRONMENT: production
      TELITE_USE_ALEMBIC: "true"
      LOG_FORMAT: json

  celery_beat:
    environment:
      ENVIRONMENT: production
      LOG_FORMAT: json
