global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: telite-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8001

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

