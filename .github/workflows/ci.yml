name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - Dev-Ops

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: telite-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: telite_backend_ci
          POSTGRES_USER: telite_ci
          POSTGRES_PASSWORD: ${{ format('telite-ci-pg-{0}-{1}', github.run_id, github.run_attempt) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telite_ci -d telite_backend_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      PYTHONPATH: .
      TELITE_DATABASE_URL: postgresql+psycopg://telite_ci:${{ format('telite-ci-pg-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/telite_backend_ci
      TELITE_TEST_DATABASE_URL: postgresql+psycopg://telite_ci:${{ format('telite-ci-pg-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/telite_backend_ci
      TELITE_AUTH_SECRET: ${{ format('telite-ci-auth-{0}-{1}-not-for-production-use', github.run_id, github.run_attempt) }}
      TELITE_PASSWORD_SALT: ${{ format('telite-ci-salt-{0}-{1}', github.run_id, github.run_attempt) }}
      REDIS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            telite-backend/requirements.txt
            telite-backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff release tooling
        run: ruff check scripts/validate_production_env.py tests/test_health.py tests/test_api_verification.py tests/test_rls_verification.py tests/test_rls_isolation.py

      - name: Run database migrations
        run: alembic upgrade head

      - name: Pytest
        run: |
          mkdir -p test-results
          pytest -q \
            --junitxml=test-results/backend-smoke.xml \
            tests/test_health.py \
            tests/test_course_creation.py \
            tests/test_task_workflow.py

      - name: Upload backend smoke test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-smoke-test-results
          path: telite-backend/test-results/*.xml
          if-no-files-found: ignore

  backend-critical-regression:
    name: Backend critical regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: telite-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: telite_backend_regression_ci
          POSTGRES_USER: telite_ci
          POSTGRES_PASSWORD: ${{ format('telite-ci-pg-{0}-{1}', github.run_id, github.run_attempt) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telite_ci -d telite_backend_regression_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      PYTHONPATH: .
      TELITE_DATABASE_URL: postgresql+psycopg://telite_ci:${{ format('telite-ci-pg-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/telite_backend_regression_ci
      TELITE_TEST_DATABASE_URL: postgresql+psycopg://telite_ci:${{ format('telite-ci-pg-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/telite_backend_regression_ci
      TELITE_AUTH_SECRET: ${{ format('telite-ci-auth-{0}-{1}-not-for-production-use', github.run_id, github.run_attempt) }}
      TELITE_PASSWORD_SALT: ${{ format('telite-ci-salt-{0}-{1}', github.run_id, github.run_attempt) }}
      REDIS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            telite-backend/requirements.txt
            telite-backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Critical LMS regression suite
        run: |
          mkdir -p test-results
          timeout 25m pytest -q \
            --junitxml=test-results/backend-critical-regression.xml \
            tests/test_health.py \
            tests/test_login_rls.py \
            tests/test_rls_isolation.py \
            tests/test_rls_verification.py \
            tests/test_manual_enrollment_service.py \
            tests/test_platform_invitations.py \
            tests/test_certificate_runtime.py \
            tests/test_certificate_notifications.py \
            tests/test_learning_path_runtime.py \
            tests/test_learning_path_notifications.py \
            tests/test_learning_path_assignment_notifications.py \
            tests/test_learning_path_completion_notifications.py \
            tests/test_completion_g04_policy.py \
            tests/test_gradebook_g02_integration.py \
            tests/test_gradebook_g03_aggregation.py \
            tests/test_gradebook_g06_operations.py \
            tests/test_announcement_runtime.py \
            tests/test_h5p_service.py

      - name: Upload backend critical regression results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-critical-regression-results
          path: telite-backend/test-results/*.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: telite-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: telite-frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint:ci

      - name: Frontend unit tests
        run: npm run test:frontend

      - name: Critical dependency audit
        run: npm audit --audit-level=critical

      - name: Build
        run: npm run build

  production-env-contract:
    name: Production env contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: telite-backend
    env:
      ENVIRONMENT: production
      TELITE_AUTH_SECRET: ${{ format('telite-ci-production-auth-{0}-{1}-not-for-production-use', github.run_id, github.run_attempt) }}
      TELITE_PASSWORD_SALT: ${{ format('telite-ci-production-salt-{0}-{1}', github.run_id, github.run_attempt) }}
      POSTGRES_PASSWORD: ${{ format('telite-ci-postgres-{0}-{1}', github.run_id, github.run_attempt) }}
      TELITE_POSTGRES_DB: telite_backend
      TELITE_POSTGRES_USER: telite_app
      TELITE_POSTGRES_PASSWORD: ${{ format('telite-ci-app-postgres-{0}-{1}', github.run_id, github.run_attempt) }}
      REDIS_PASSWORD: ${{ format('telite-ci-redis-{0}-{1}', github.run_id, github.run_attempt) }}
      TELITE_APP_URL: https://lms.example.com
      TELITE_CORS_ORIGINS: https://lms.example.com
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: strict
      R2_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate production env
        run: python -m scripts.validate_production_env

  postgres-migrations:
    name: PostgreSQL migration chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: telite-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: telite_migration_ci
          POSTGRES_USER: telite_ci
          POSTGRES_PASSWORD: ${{ format('telite-ci-pg-{0}-{1}', github.run_id, github.run_attempt) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telite_ci -d telite_migration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      TELITE_DATABASE_URL: postgresql+psycopg://telite_ci:${{ format('telite-ci-pg-{0}-{1}', github.run_id, github.run_attempt) }}@localhost:5432/telite_migration_ci
      TELITE_AUTH_SECRET: ${{ format('telite-ci-auth-{0}-{1}-not-for-production-use', github.run_id, github.run_attempt) }}
      TELITE_PASSWORD_SALT: ${{ format('telite-ci-salt-{0}-{1}', github.run_id, github.run_attempt) }}
      REDIS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            telite-backend/requirements.txt
            telite-backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate fresh database migrations
        run: alembic upgrade head

      - name: Validate one-step rollback and re-upgrade
        run: |
          alembic downgrade -1
          alembic upgrade head

  docker:
    name: Docker compose build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend
      - backend-critical-regression
      - frontend
      - production-env-contract
      - postgres-migrations
    env:
      ENVIRONMENT: production
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{ format('telite-ci-postgres-{0}-{1}', github.run_id, github.run_attempt) }}
      TELITE_POSTGRES_DB: telite_backend
      TELITE_POSTGRES_USER: telite_app
      TELITE_POSTGRES_PASSWORD: ${{ format('telite-ci-app-postgres-{0}-{1}', github.run_id, github.run_attempt) }}
      TELITE_AUTH_SECRET: ${{ format('telite-ci-production-auth-{0}-{1}-not-for-production-use', github.run_id, github.run_attempt) }}
      TELITE_PASSWORD_SALT: ${{ format('telite-ci-production-salt-{0}-{1}', github.run_id, github.run_attempt) }}
      REDIS_PASSWORD: ${{ format('telite-ci-redis-{0}-{1}', github.run_id, github.run_attempt) }}

      TELITE_APP_URL: https://lms.example.com
      TELITE_CORS_ORIGINS: https://lms.example.com
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: strict

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Build application images
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend frontend

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
